name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre-commit:
    name: Pre-Commit Validation
    permissions:
      contents: read
      pull-requests: write  # post-comment
    uses: DarojaAI/public-workflows/.github/workflows/reusable-pre-commit.yml@8941de03ddf552f483806e493bbb86e22626f1cc  # v2.1.0
    with:
      terraform-version: '1.15.1'
      post-comment: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  terraform-stub-plan:
    name: Terraform Stub Plan (templatefile validation)
    permissions:
      contents: read
    uses: DarojaAI/public-workflows/.github/workflows/reusable-terraform-stub-plan.yml@8941de03ddf552f483806e493bbb86e22626f1cc  # v2.1.0
    with:
      terraform-version: '1.15.1'
      working-directory: 'modules/postgres-platform'
      backend-file: 'modules/postgres-platform/backend.tf'
      module-cache-path: 'modules/postgres-platform/.terraform/modules'
      cache-key-file: 'modules/postgres-platform/main.tf'
      stub-vars-json: '{}'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
