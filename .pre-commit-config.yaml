# Pre-commit hooks for terraform-gcp-wrappers
# Install: pip install -r requirements.txt && pre-commit install

repos:
  # Base hooks — filesystem hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: mixed-line-ending
        args: [--fix=lf]

  # actionlint — GitHub Actions workflow validation
  - repo: https://github.com/rhysd/actionlint
    rev: v1.6.27
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  # Terraform fmt — only the active wrapper module (postgres-platform).
  # Other modules in this repo are archived; skip them.
  # terraform_validate is handled by ci.yml (reusable-terraform-stub-plan).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
        files: ^modules/postgres-platform/.*\.tf$

  # Yamllint — YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [--strict]
        files: ^\.github/workflows/|^modules/
  # Gitleaks — secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
